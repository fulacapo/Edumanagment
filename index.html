<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduManage Software Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              green: '#2E5C44', // Deeper, more forest green for premium feel
              gold: '#C5A065',  // Muted gold for accents
              dark: '#1F2937',
              light: '#F9FAFB', // Paper-like background
              soft_green: '#D1FAE5',
              soft_red: '#FEE2E2',
            }
          },
          fontFamily: {
            serif: ['Playfair Display', 'serif'],
            sans: ['Inter', 'sans-serif'],
          },
          boxShadow: {
            'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
            'card': '0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06)',
          }
        }
      }
    }
  </script>
  <style>
    /* Custom print styles for the receipt if needed, though we use jsPDF */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #f3f4f6;
    }

    /* Stamp Animation */
    .stamp-enter {
      opacity: 0;
      transform: scale(1.5) rotate(-10deg);
    }

    .stamp-enter-active {
      opacity: 0.8;
      transform: scale(1) rotate(-12deg);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
  </style>


</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
